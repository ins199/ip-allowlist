name: Leak Check

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks：扫描已知密钥格式（AWS Key/GitHub Token/私钥等），平台级 secret 兜底
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 敏感词列表存放在 GitHub Secret（LEAK_WORDS），不写入公开仓库（避免自曝内部信息）
      - name: Scan for internal info leaks
        env:
          LEAK_WORDS: ${{ secrets.LEAK_WORDS }}
        run: |
          if [ -z "$LEAK_WORDS" ]; then
            echo "⚠️ 未配置 LEAK_WORDS secret，跳过泄露扫描"
            exit 0
          fi
          # LEAK_WORDS 为 | 分隔的敏感词/正则片段
          LEAKS=$(grep -rniE "$LEAK_WORDS" \
            --include="*.go" --include="*.md" --include="*.sh" --include="*.yaml" --include="*.yml" \
            --include="*.html" --include="*.json" \
            --exclude-dir=.git --exclude-dir=.github \
            . 2>/dev/null | grep -v "^Binary" || true)
          if [ -n "$LEAKS" ]; then
            echo "❌ 检测到内部信息泄露："
            echo "$LEAKS"
            exit 1
          fi
          echo "✅ 无内部信息泄露"

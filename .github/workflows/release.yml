name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" -o dist/ip-allowlist-linux-amd64 .

      - name: Build linux/arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" -o dist/ip-allowlist-linux-arm64 .

      - name: Upload binaries to Aliyun OSS (国内镜像源)
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_AK_ID: ${{ secrets.OSS_AK_ID }}
          OSS_AK_SECRET: ${{ secrets.OSS_AK_SECRET }}
        run: |
          if [ -z "$OSS_ENDPOINT" ] || [ -z "$OSS_BUCKET" ] || [ -z "$OSS_AK_ID" ] || [ -z "$OSS_AK_SECRET" ]; then
            echo "==> 跳过 OSS 上传（未配置 OSS_* secrets）"
            exit 0
          fi
          wget -q https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip -O /tmp/ossutil.zip
          unzip -oq /tmp/ossutil.zip -d /tmp/ossutil
          sudo cp /tmp/ossutil/ossutil-v1.7.19-linux-amd64/ossutil64 /usr/local/bin/ossutil64
          ossutil64 config -e "$OSS_ENDPOINT" -i "$OSS_AK_ID" -k "$OSS_AK_SECRET"
          ossutil64 cp -f dist/ip-allowlist-linux-amd64 oss://$OSS_BUCKET/
          ossutil64 cp -f dist/ip-allowlist-linux-arm64 oss://$OSS_BUCKET/
          echo "==> 已上传二进制到 OSS 镜像源"

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
